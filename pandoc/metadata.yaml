# pandoc/metadata.yaml
#
# Default look of every exported document. These are *metadata*, so any of
# them can be overridden from the YAML header of a note:
#
#   ---
#   lang: en-US
#   geometry: margin=3cm
#   ---
# Language: hyphenation, quotes and labels ("Contents", "Sumário", ...)
# Needs texlive-langportuguese on Arch Linux for pt-BR hyphenation.
lang: pt-BR
# Page layout
documentclass: article
fontsize: 12pt
geometry: margin=2.5cm
linestretch: 1.5
indent: true # first-line indent instead of space between paragraphs
booktabs: true # nicer tables
# Colored (not boxed) links
colorlinks: true
linkcolor: blue
urlcolor: blue
