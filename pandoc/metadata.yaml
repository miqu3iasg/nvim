# ~/.config/nvim/pandoc/metadata.yaml
#
# Default look of every exported document. These are *metadata*, so any of
# them can be overridden from the YAML header of a note:
#
#   ---
#   lang: en-US
#   geometry: margin=3cm
#   ---
# Language: hyphenation, quotes and labels ("Contents", "Sumário", ...)
# Needs texlive-langportuguese on Arch Linux for pt-BR hyphenation.
lang: pt-BR
# Academic-looking page
documentclass: article
fontsize: 11pt
geometry: margin=2.5cm
linestretch: 1.15
indent: true # first-line indent instead of space between paragraphs
booktabs: true # nicer tables
# Colored (not boxed) links
colorlinks: true
linkcolor: blue
urlcolor: blue
citecolor: blue
# Citations: link each citation to its entry and title the reference list.
# For an English document set `reference-section-title: References`.
# Only used when the document actually cites something.
link-citations: true
reference-section-title: Referências
